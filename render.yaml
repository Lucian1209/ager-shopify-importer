services:
  - type: web
    name: ager-shopify-importer
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AGER_FEED_URL
        value: https://dropt.in.ua/index.php?route=export/prom&markup=85&ids=uniq
      - key: SHOPIFY_SHOP
        value: ftz0ia-nw.myshopify.com
      - key: SHOPIFY_API_VERSION
        value: "2026-10"
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: APP_API_KEY
        generateValue: true
      - key: MARKUP_PERCENT
        value: "0"
      - key: MARKUP_FIXED
        value: "0"
      - key: SYNC_DRY_RUN
        value: "true"
      - key: SYNC_LIMIT
        value: "10"
      - key: SYNC_INTERVAL_MINUTES
        value: "360"
      - key: SYNC_UPDATE_CONTENT
        value: "true"
    # Persistent feed list + XML cache (needs a paid plan: change `plan` above, then uncomment):
    #   disk:
    #     name: importer-data
    #     mountPath: /var/data
    #     sizeGB: 1
    #   and add to envVars:
    #     - key: FEED_DB_PATH
    #       value: /var/data/feeds.db
    #     - key: FEED_CACHE_DIR
    #       value: /var/data/feed-cache
